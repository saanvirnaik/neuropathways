name: Validate application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: np_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: np_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U np_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend tests and PostgreSQL migrations
        working-directory: neuropathways-backend
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/np_test
          TEST_POSTGRES_USER: np_test
          TEST_POSTGRES_PASSWORD: ephemeral-ci-only
        run: bash ./gradlew --no-daemon test bootJar
      - name: Frontend build
        working-directory: neuropathways-frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
        run: |
          npm ci
          npm run build
      - name: Deployment script syntax and guards
        shell: pwsh
        run: ./scripts/Test-DeploymentScript.ps1
      - name: Hostinger release lifecycle in a local fixture
        run: bash scripts/Test-HostingerRelease.sh
