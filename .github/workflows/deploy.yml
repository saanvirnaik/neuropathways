name: Deploy NeuroPathways
run-name: NeuroPathways ${{ inputs.environment }} ${{ inputs.operation }} ${{ inputs.request_id }}
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      operation:
        type: string
        default: Deploy
      commit:
        type: string
        required: true
      rollback:
        type: string
        default: ''
      request_id:
        type: string
        default: automatic
  workflow_dispatch:
    inputs:
      environment:
        description: Destination
        type: choice
        options: [Staging, Production]
        default: Staging
        required: true
      operation:
        description: Deploy or one-time setup operation
        type: choice
        options: [Deploy, CheckConnection, Initialize, AdoptStaging, Rollback]
        default: Deploy
        required: true
      commit:
        description: Full commit SHA to deploy (blank uses selected branch)
        type: string
      rollback:
        description: Previous managed release ID for Rollback
        type: string
      request_id:
        description: Optional unique request ID supplied by Deploy-FromGitHub.ps1
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: np_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: np_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U np_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare and verify SSH connection
        shell: pwsh
        env:
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG_JSON }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $ErrorActionPreference='Stop'
          if (!$env:DEPLOY_CONFIG -or !$env:SSH_KEY) { throw 'Missing DEPLOY_CONFIG_JSON or HOSTINGER_SSH_KEY in the selected GitHub environment.' }
          $env:DEPLOY_CONFIG | Set-Content deploy/environments.local.json
          $env:SSH_KEY | Set-Content "$env:RUNNER_TEMP/hostinger-key"
          chmod 600 "$env:RUNNER_TEMP/hostinger-key"
          ./scripts/Prepare-HostingerConnection.ps1 -ConfigPath deploy/environments.local.json -Environment $env:TARGET_ENVIRONMENT -KnownHostsPath "$env:RUNNER_TEMP/known_hosts"
      - name: Execute requested operation
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          TARGET_COMMIT: ${{ inputs.commit }}
          ROLLBACK_RELEASE: ${{ inputs.rollback }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NP_SSH_KEY: ${{ runner.temp }}/hostinger-key
          NP_KNOWN_HOSTS: ${{ runner.temp }}/known_hosts
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/np_test
          TEST_POSTGRES_USER: np_test
          TEST_POSTGRES_PASSWORD: ephemeral-ci-only
        run: |
          $ErrorActionPreference='Stop'
          $p=@{Environment=$env:TARGET_ENVIRONMENT}
          switch ($env:OPERATION) {
            'CheckConnection' { $p.CheckConnection=$true }
            'Initialize' { $p.Initialize=$true }
            'AdoptStaging' { $p.AdoptInitialStaging=$true }
            'Rollback' {
              if (!$env:ROLLBACK_RELEASE) { throw 'A managed release ID is required.' }
              $p.Rollback=$env:ROLLBACK_RELEASE
            }
            'Deploy' { $p.Commit=if ($env:TARGET_COMMIT) {$env:TARGET_COMMIT} else {$env:GITHUB_SHA} }
            default { throw 'Unknown deployment operation.' }
          }
          ./scripts/Deploy-NeuroPathways.ps1 @p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-report-${{ inputs.environment }}
          path: .deploy-output/*.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Remove ephemeral connection files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/hostinger-key","$env:RUNNER_TEMP/known_hosts" -Force -ErrorAction SilentlyContinue
